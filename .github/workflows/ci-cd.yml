name: Build IQ CI/CD

on:
  push:
    branches:
      - main
      - development

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bx-constrogen-frontend

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v3
      id: yarn-cache
      with:
        path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Install dependencies
      run: yarn install

    - name: Build React app
      run: REACT_APP_ENV=${{ github.ref_name == 'main' && 'prod' || 'dev' }} yarn build

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.IMAGE_NAME }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      id: docker_build
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64,linux/arm/v8,linux/arm/v7
        tags: |
          ${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          REACT_APP_ENV=${{ github.ref_name == 'main' && 'prod' || 'dev' }}

  deploy:
      name: Deploy Docker Image to EC2
      runs-on: ubuntu-latest
      needs: build

      steps:
        - name: Set up SSH for EC2
          uses: webfactory/ssh-agent@v0.5.3
          with:
            ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

        - name: Add EC2 host to known_hosts
          run: |
            ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

        - name: Deploy Docker Image
          run: |
            ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
              docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

              TAG=${{ github.ref_name == 'main' && 'prod' || 'dev' }}
              PORT=\$( [ "\$TAG" = "prod" ] && echo "3000" || echo "3001" )

              docker pull ${{ env.IMAGE_NAME }}:\$TAG

              docker stop bx-frontend_\$TAG || true && docker rm bx-frontend_\$TAG || true

              docker run -d \
                --name bx-frontend_\$TAG \
                -p \$PORT:80 \
                -e NODE_ENV="${{ secrets.NODE_ENV }}" \
                -e REACT_APP_ENV=\$TAG \
                ${{ env.IMAGE_NAME }}:\$TAG
            EOF
