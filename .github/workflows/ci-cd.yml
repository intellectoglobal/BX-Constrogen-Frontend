name: Build IQ CI/CD

on:
  push:
    branches:
      - main
      - development

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build, Push Docker Image to GHCR, and Deploy to GitHub Pages 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "::set-output name=dir::$(yarn cache dir)"

    - name: Cache dependencies
      uses: actions/cache@v3
      id: yarn-cache
      with:
        path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Install dependencies
      run: yarn install

    - name: Build
      run: REACT_APP_ENV=${{ github.ref_name == 'main' && 'prod' || 'dev' }} yarn build

    - name: Deploy to GitHub Pages
      run: |
        git config --global user.name $user_name
        git config --global user.email $user_email
        git remote set-url origin https://${github_token}@github.com/${repository}
        yarn deploy
      if: github.ref_name == 'development'
      env:
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        github_token: ${{ secrets.ACTIONS_DEPLOY_ACCESS_TOKEN }}
        repository: igblsln/build-iq
        MODE: ${{ secrets.MODE }}

    - name: Debug ENV variable value
      run: echo "MODE is set to ${MODE} and value in secrets ${{ secrets.MODE }}"

    - name: Log in to the Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      id: docker_build
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64,linux/arm/v8,linux/arm/v7
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'main' || 'development' }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          REACT_APP_ENV=${{ github.ref_name == 'main' && 'prod' || 'dev' }}

  deploy:
    name: Pull and Deploy Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'

    steps:
      - name: Set up SSH for EC2
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Docker Image to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            docker pull ${{ secrets.PROD_DOCKER_IMAGE }}

            docker stop erp_ui || true && docker rm erp_ui || true

            docker run -d \
              --name erp_ui \
              -p 3000:80 \
              -e NODE_ENV="${{ secrets.NODE_ENV }}" \
              -e REACT_APP_ENV=prod \
              ${{ secrets.PROD_DOCKER_IMAGE }}
          EOF
